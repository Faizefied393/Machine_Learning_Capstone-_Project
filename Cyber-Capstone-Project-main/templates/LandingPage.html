  <script>
  /* ---------- tweakables ---------- */
  const CHUNK_SIZE   = 500;        // keys per /generate-presigned-urls call
  const MAX_PARALLEL = 8;          // simultaneous PUTs to S3
  const POLL_EVERY   = 2_000;      // ms between /job-status polls
  /* -------------------------------- */

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  document.getElementById("upload-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const statusEl   = document.getElementById("status");
    const downloadEl = document.getElementById("download-btn");
    downloadEl.style.display = "none";
    statusEl.textContent = "";

    /* 0️⃣ gather files */
    const files = Array.from(document.getElementById("fileInput").files);
    if (!files.length) {
      alert("Please select at least one file.");
      return;
    }

    /* 1️⃣ build S3 keys */
    const ts   = Date.now();
    const keys = files.map(f => `uploads/${ts}/${f.name}`);

    /* 2️⃣ get presigned URLs in CHUNK_SIZE batches */
    statusEl.textContent = "Requesting upload URLs…";
    const presigned = [];   // will fill with {filename, url}
    for (let i = 0; i < keys.length; i += CHUNK_SIZE) {
      const slice = keys.slice(i, i + CHUNK_SIZE);
      const res   = await fetch("/generate-presigned-urls", {
        method  : "POST",
        headers : {"Content-Type":"application/json"},
        body    : JSON.stringify({filenames: slice})
      });
      /* streaming endpoint returns an array – safest to parse as text first */
      const chunkUrls = JSON.parse(await res.text());
      presigned.push(...chunkUrls);
      statusEl.textContent =
        `Got ${presigned.length} / ${keys.length} upload URLs…`;
    }

    /* 3️⃣ PUT each file (with simple parallel-limit queue) */
    statusEl.textContent = "Uploading to S3…";
    let inFlight = 0, done = 0;
    const uploadErrors = [];

    const next = async (task) => {
      inFlight++;
      try { await task(); }
      catch (err) { uploadErrors.push(err); }
      done++;
      statusEl.textContent =
        `Uploading… ${done} / ${presigned.length}`;
      inFlight--;
      runQueue();
    };

    const queue = presigned.map(({filename, url}) => () =>
      fetch(url, {
        method: "PUT",
        body  : files.find(f => f.name === filename.split("/").pop())
      })
    );

    const runQueue = () => {
      while (inFlight < MAX_PARALLEL && queue.length) {
        next(queue.shift());
      }
    };
    runQueue();

    /* wait for all uploads to finish */
    while (done < presigned.length) await sleep(200);

    if (uploadErrors.length) {
      statusEl.textContent = "❌ Upload failed – check console.";
      console.error("Upload errors:", uploadErrors);
      return;
    }

    /* 4️⃣ start the Lambda job */
    statusEl.textContent = "Processing images…";
    const {job_id} = await fetch("/start-job", {
      method  : "POST",
      headers : {"Content-Type":"application/json"},
      body    : JSON.stringify({keys})
    }).then(r => r.json());

    /* 5️⃣ poll for completion */
    let downloadUrl = null;
    while (true) {
      const res  = await fetch(`/job-status/${job_id}`);
      const json = await res.json();
      if (json.status === "done") {
        downloadUrl = json.download_url;
        break;
      }
      if (json.status === "error") {
        statusEl.textContent = "❌ Processing error – check logs.";
        return;
      }
      await sleep(POLL_EVERY);
    }

    /* 6️⃣ show download */
    statusEl.textContent = "✅ Finished!";
    downloadEl.href      = downloadUrl;
    downloadEl.style.display = "inline-block";
  });
  </script>
